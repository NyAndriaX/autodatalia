name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Build must succeed with no backend wired (graceful-degradation).
          NEXT_PUBLIC_API_BASE_URL: ""

  backend:
    name: Backend (compile + import + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Byte-compile
        run: python -m compileall -q app
      - name: Import app (smoke)
        env:
          CONTENT_DIR: ./content
        run: python -c "import app.main; print('app imports OK')"
      - name: Pytest
        env:
          CONTENT_DIR: ./content
          AI_API_KEY: test-fake-key
          AI_DAILY_LIMIT: "0"
          TUNNEL_ENABLED: "false"
        run: python -m pytest tests/ -v

  docker:
    name: Backend image build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t datalia-backend:ci ./backend
