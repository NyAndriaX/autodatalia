# Production compose for the VM.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production logs -f

# Pin the project name so volumes/networks are deterministically `datalia_*`
# regardless of the host directory name — DEPLOY.md's backup/restore commands
# reference `datalia_mariadb-data` etc.
name: datalia

services:
  mariadb:
    image: mariadb:11.4
    container_name: datalia-mariadb
    restart: always
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-datalia}
      MARIADB_USER: ${MARIADB_USER:-datalia}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-datalia}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-datalia-root}
    volumes:
      - mariadb-data:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      API_DOMAIN: ${API_DOMAIN}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Only wait for upstreams to *start*, not pass their healthcheck. A
    # backend/DB misconfig must not block Caddy from coming up: we still want
    # it to provision/renew TLS certs and serve a 502 for the broken upstream
    # rather than taking down HTTPS for every host.
    depends_on:
      caption-api:
        condition: service_started
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

  caption-api:
    build:
      context: ../backend
      args:
        INSTALL_DEV_DEPS: "false"
    container_name: caption-api
    restart: always
    expose:
      - "8000"
    depends_on:
      mariadb:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      # AI provider KEYS are per-user — each account sets its own in the app's
      # Settings (stored per-tenant in MariaDB). Intentionally NOT global env
      # vars. Only non-secret defaults (base URL / model / limits) live here.
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://openrouter.ai/api/v1}
      AI_MODEL: ${AI_MODEL:-google/gemini-2.5-flash}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-google/gemini-2.5-flash}
      AI_MODEL_PREMIUM: ${AI_MODEL_PREMIUM:-}
      AI_INCLUDE_IMAGES: ${AI_INCLUDE_IMAGES:-false}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-200}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      BACKEND_AUTH_TOKEN: ${BACKEND_AUTH_TOKEN}
      ALLOW_OPEN_AUTH: ${ALLOW_OPEN_AUTH:-false}
      ALLOW_OPEN_REGISTRATION: ${ALLOW_OPEN_REGISTRATION:-true}
      AUTH_RATE_LIMIT_ATTEMPTS: ${AUTH_RATE_LIMIT_ATTEMPTS:-10}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
      TUNNEL_ENABLED: "false"
      OAUTH_REDIRECT_BASE: https://${API_DOMAIN}
      PUBLIC_BASE_URL: https://${API_DOMAIN}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET}
      TIKTOK_DOMAIN_VERIFY: ${TIKTOK_DOMAIN_VERIFY}
      TIKTOK_SCOPES: ${TIKTOK_SCOPES:-user.info.basic,video.upload}
      TIKTOK_UPLOAD_MODE: ${TIKTOK_UPLOAD_MODE:-file}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION:-202603}
      # Password-reset email (optional). With no SMTP_HOST set, the reset link is
      # logged instead of emailed. PUBLIC_APP_URL is the frontend origin used to
      # build the reset link (e.g. https://app.yourdomain).
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      JWT_SECRET: ${JWT_SECRET:-}
      ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      MARIADB_HOST: ${MARIADB_HOST:-mariadb}
      MARIADB_PORT: ${MARIADB_PORT:-3306}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-datalia}
      MARIADB_USER: ${MARIADB_USER:-datalia}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-datalia}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Image/video provider keys are also per-user (Settings UI). Only the
      # non-secret model/base-url defaults stay here.
      AI_IMAGE_API_BASE_URL: ${AI_IMAGE_API_BASE_URL:-}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-}
      AI_VIDEO_API_BASE_URL: ${AI_VIDEO_API_BASE_URL:-}
      AI_VIDEO_MODEL: ${AI_VIDEO_MODEL:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      REPLICATE_VIDEO_MODEL: ${REPLICATE_VIDEO_MODEL:-lightricks/ltx-video}
      REPLICATE_VIDEO_VERSION: ${REPLICATE_VIDEO_VERSION:-}
      FAL_API_KEY: ${FAL_API_KEY:-}
      FAL_VIDEO_MODEL: ${FAL_VIDEO_MODEL:-fal-ai/ltx-video}
      LTX_API_KEY: ${LTX_API_KEY:-}
      LTX_API_BASE_URL: ${LTX_API_BASE_URL:-https://api.ltx.video/v1}
      LTX_VIDEO_MODEL: ${LTX_VIDEO_MODEL:-ltx-2-3-pro}
      VIDEO_COST_PER_SECOND_USD: ${VIDEO_COST_PER_SECOND_USD:-0.04}
      CONTENT_DIR: /home/app/content
      DATALIA_DEFAULT_TZ: ${DATALIA_DEFAULT_TZ:-Europe/Paris}
    volumes:
      - caption-content:/home/app/content

  frontend:
    build:
      context: ../frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=https://${API_DOMAIN}
    # Container name matches the service name Caddy's `reverse_proxy
    # frontend:3000` resolves, keeping prod symmetric with that hostname.
    container_name: frontend
    restart: always
    expose:
      - "3000"
    # Start once the API container is up; don't gate on its healthcheck so a
    # backend issue doesn't keep the frontend (and Caddy) from coming up.
    depends_on:
      caption-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  caption-content:
  caddy-data:
  caddy-config:
  mariadb-data:
