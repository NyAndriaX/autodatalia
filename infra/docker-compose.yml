services:
  mariadb:
    image: mariadb:11.4
    container_name: datalia-mariadb
    restart: always
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-datalia}
      MARIADB_USER: ${MARIADB_USER:-datalia}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-datalia}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-datalia-root}
    volumes:
      - mariadb_data:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  caption-api:
    build:
      context: ../backend
      args:
        INSTALL_DEV_DEPS: "true"
    container_name: caption-api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      mariadb:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://openrouter.ai/api/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-google/gemini-3.1-flash-lite}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-google/gemini-3.1-flash-lite}
      AI_MODEL_PREMIUM: ${AI_MODEL_PREMIUM:-}
      AI_INCLUDE_IMAGES: ${AI_INCLUDE_IMAGES:-false}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-200}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3005,http://127.0.0.1:3005}
      DATALIA_DEFAULT_TZ: ${DATALIA_DEFAULT_TZ:-Europe/Paris}
      BACKEND_AUTH_TOKEN: ${BACKEND_AUTH_TOKEN:-}
      ALLOW_OPEN_AUTH: ${ALLOW_OPEN_AUTH:-true}
      TUNNEL_ENABLED: ${TUNNEL_ENABLED:-false}
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://localhost:8000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_DOMAIN_VERIFY: ${TIKTOK_DOMAIN_VERIFY:-}
      TIKTOK_SCOPES: ${TIKTOK_SCOPES:-user.info.basic,video.upload,video.publish}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      AI_IMAGE_API_BASE_URL: ${AI_IMAGE_API_BASE_URL:-}
      AI_IMAGE_API_KEY: ${AI_IMAGE_API_KEY:-}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-}
      AI_VIDEO_API_BASE_URL: ${AI_VIDEO_API_BASE_URL:-}
      AI_VIDEO_API_KEY: ${AI_VIDEO_API_KEY:-}
      AI_VIDEO_MODEL: ${AI_VIDEO_MODEL:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      REPLICATE_VIDEO_MODEL: ${REPLICATE_VIDEO_MODEL:-lightricks/ltx-video}
      REPLICATE_VIDEO_VERSION: ${REPLICATE_VIDEO_VERSION:-}
      FAL_API_KEY: ${FAL_API_KEY:-}
      FAL_VIDEO_MODEL: ${FAL_VIDEO_MODEL:-fal-ai/ltx-video}
      LTX_API_KEY: ${LTX_API_KEY:-}
      LTX_API_BASE_URL: ${LTX_API_BASE_URL:-https://api.ltx.video/v1}
      LTX_VIDEO_MODEL: ${LTX_VIDEO_MODEL:-ltx-2-3-pro}
      VIDEO_COST_PER_SECOND_USD: ${VIDEO_COST_PER_SECOND_USD:-0.04}
      DATABASE_URL: ${DATABASE_URL:-}
      MARIADB_HOST: ${MARIADB_HOST:-mariadb}
      MARIADB_PORT: ${MARIADB_PORT:-3306}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-datalia}
      MARIADB_USER: ${MARIADB_USER:-datalia}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-datalia}
      JWT_SECRET: ${JWT_SECRET:-}
      CONTENT_DIR: /home/app/content
    volumes:
      - ../backend/content:/home/app/content
      - ../backend/app:/home/app/app
      - ../backend/tests:/home/app/tests

  frontend:
    build:
      context: ../frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    container_name: datalia-frontend
    restart: always
    ports:
      - "3005:3000"
    depends_on:
      caption-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  mariadb_data:
